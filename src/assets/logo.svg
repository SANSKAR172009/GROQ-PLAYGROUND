<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nebula-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F55036" />
    </linearGradient>
    <linearGradient id="nebula-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing orbital ring -->
  <circle cx="20" cy="20" r="17" stroke="url(#nebula-grad-2)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6" />
  <!-- Dynamic orbital arc -->
  <path d="M 6 20 A 14 14 0 0 1 34 20" stroke="url(#nebula-grad-1)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- Central Groq Core LPU Diamond -->
  <rect x="13" y="13" width="14" height="14" rx="3" transform="rotate(45 20 20)" fill="url(#nebula-grad-1)" />
  <rect x="16" y="16" width="8" height="8" rx="1.5" transform="rotate(45 20 20)" fill="#07090E" />
  <!-- Center photon pulse -->
  <circle cx="20" cy="20" r="2.5" fill="#22D3EE" filter="url(#glow)" />
</svg>

